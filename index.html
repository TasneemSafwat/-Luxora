<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="LUXORA — a curated house of considered design. Discover premium fashion, accessories and objects crafted for a modern, quiet luxury."
    />
    <meta name="author" content="LUXORA" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="LUXORA — Quiet Luxury, Considered" />
    <meta
      property="og:description"
      content="A curated house of considered design. Premium fashion, accessories and objects for the modern wardrobe."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Banner photography CDNs: open the connections early so the hero photo starts downloading sooner -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://images.pexels.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Only the weights the UI actually uses (400/500/600) are requested, and the
      stylesheet is loaded without blocking first paint (display=swap keeps text visible).
      Cairo (Arabic) is NOT requested here: it is injected on demand when the
      language is Arabic — see the inline script below and src/utils/fonts.js.
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      />
    </noscript>

    <title>LUXORA — Quiet Luxury, Considered</title>

    <script>
      // Runs before first paint so there is no flash of the wrong theme / direction.
      // NOTE: the app stores these two values as plain strings ("dark", "ar"), not JSON.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('luxora.theme');
          var dark = theme ? theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';

          var lang = localStorage.getItem('luxora.lang');
          if (lang === 'ar' || lang === 'en') {
            root.lang = lang;
            root.dir = lang === 'ar' ? 'rtl' : 'ltr';
          }
          if (lang === 'ar') {
            var link = document.createElement('link');
            link.rel = 'stylesheet';
            link.id = 'font-arabic';
            link.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600&display=swap';
            document.head.appendChild(link);
          }
        } catch (e) {
          /* storage blocked — the React providers will resolve the defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
